plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.4.0'
group = 'dev.hearthhorizons'
base { archivesName = 'hearth-horizons-compat' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories { mavenCentral() }
def profile = providers.gradleProperty('minecraftProfile').orElse(providers.environmentVariable('HH_MINECRAFT_PROFILE'))
    .getOrElse("${System.getProperty('user.home')}/AppData/Roaming/ModrinthApp/profiles/NeoForge 1.21.1")
def dependencyMods = fileTree("${profile}/mods") {
    include 'cluttered-*.jar', 'moonlight-*.jar', 'hexerei-*.jar'
}
dependencies {
    implementation dependencyMods
    compileOnly fileTree("${profile}/mods") { include 'jei-*.jar' }
    compileOnly fileTree("${profile}/mods") { include 'create-1.21.1-*.jar' }
    compileOnly fileTree("${profile}/mods") { include 'FarmersDelight-*.jar' }
    compileOnly fileTree("${profile}/mods") { include 'letsdo-farm_and_charm-*.jar' }
    if (providers.gradleProperty('shaderQa').isPresent()) {
        runtimeOnly fileTree("${profile}/mods") { include 'iris-neoforge-*.jar', 'sodium-neoforge-*.jar', 'iris-flywheel-compat-*.jar' }
    }
    if (providers.gradleProperty('recipePackQa').isPresent()) {
        def qaMods = new groovy.json.JsonSlurper().parse(file('qa-recipe-mods.json')).files
        runtimeOnly files(qaMods.findAll { !it.startsWith('cluttered-') && !it.startsWith('moonlight-') && !it.startsWith('hexerei-') }.collect { "${profile}/mods/${it}" })
    }
    if (providers.gradleProperty('fullPackQa').isPresent()) {
        runtimeOnly fileTree("${profile}/mods") {
            include '*.jar'
            exclude 'cluttered-*.jar', 'moonlight-*.jar', 'hexerei-*.jar', 'hearth-horizons-compat-*.jar'
            // Client presentation mods are not part of a dedicated-server codec test.
            exclude 'holdmyitemsnf-*', 'sounds-*', 'immersive-sound-*', 'seamless-loading-screen-*',
                'SmoothPlayerAnimations_*', 'CustomSkinLoader_*', 'iris-*', 'sodium-*',
                'DistantHorizons-*', 'entityculling-*', 'continuity-*', 'notenoughanimations-*', 'seasonhud-*'
            // Aeronautics' bundled service lookup fails on the development classpath in Ponder.
            exclude 'create-aeronautics-bundled-*'
        }
    }
}
neoForge {
    version = '21.1.228'
    runs {
        client {
            client()
            gameDirectory = file('run/client')
            jvmArgument '-Xmx2G'
            if (providers.gradleProperty('jeiQa').isPresent()) {
                jvmArgument '-Xmx6G'
                systemProperty 'hh.jeiQa', 'true'
                if (providers.gradleProperty('jeiQaReload').isPresent()) { systemProperty 'hh.jeiQaReload', 'true' }
                programArguments.addAll '--quickPlaySingleplayer', 'JeiQA', '--width', '1440', '--height', '900'
            }
            if (providers.gradleProperty('sodaQa').isPresent()) {
                jvmArgument '-Xmx6G'
                systemProperty 'hh.sodaQa', 'true'
                if (providers.gradleProperty('kitchenQa').isPresent()) { systemProperty 'hh.kitchenQa', 'true' }
                systemProperty 'hh.shaderQa', providers.gradleProperty('shaderQa').isPresent().toString()
                programArguments.addAll '--quickPlaySingleplayer', 'JeiQA', '--width', '1440', '--height', '900'
            }
            systemProperty 'neoforge.enabledGameTestNamespaces', 'hearth_horizons_compat'
            if (providers.gradleProperty('shelfQa').isPresent()) {
                systemProperty 'hh.shelfQa', 'true'
                programArguments.addAll '--quickPlaySingleplayer', 'ShelfQA', '--width', '1280', '--height', '720'
            }
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file(providers.gradleProperty('recipePackQa').isPresent() ? 'run/recipe-gametest' : 'run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'hearth_horizons_compat'
            if (providers.gradleProperty('fullPackQa').isPresent()) { jvmArgument '-Xmx6G' }
            else if (providers.gradleProperty('recipePackQa').isPresent()) { jvmArgument '-Xmx4G' }
        }
    }
    mods { hearth_horizons_compat { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Jar).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    includeEmptyDirs = false
    exclude 'dev/hearthhorizons/compat/gametest/**', 'dev/hearthhorizons/compat/client/ClientQa.class'
    exclude 'data/hearth_horizons_compat/structure/*.nbt'
    exclude 'qa/**'
    exclude 'dev/hearthhorizons/compat/client/JeiQa*'
    exclude 'dev/hearthhorizons/compat/client/SodaQa*'
    from('LICENSE') { into 'META-INF' }
}
